# MySQL para o perfil PRODUCAO (somente desenvolvimento e demonstração).
# Uso: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: biblioteca-mysql
    environment:
      MYSQL_DATABASE: biblioteca
      MYSQL_USER: biblioteca
      MYSQL_PASSWORD: biblioteca
      MYSQL_ROOT_PASSWORD: raiz-dev
    ports:
      - "3310:3306"   # 3310 no computador, para não conflitar com outro MySQL nas portas 3306 e 3307
